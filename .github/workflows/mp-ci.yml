name: mp CI · Preview Build

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mp-ci.yml"
  push:
    branches: [main]

concurrency:
  group: mp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeCheck + Lint + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm typecheck

      - name: Biome lint
        run: pnpm lint

      - name: Vitest (with coverage)
        run: pnpm test:coverage

      - name: Build (Taro → dist/)
        run: pnpm build:weapp

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: weapp-dist-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  preview:
    name: Generate preview QR code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm + Node
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:weapp

      - name: Generate preview QR (miniprogram-ci)
        env:
          # 私钥 base64 编码后存入 GitHub Secret MP_PRIVATE_KEY_BASE64
          MP_PRIVATE_KEY_BASE64: ${{ secrets.MP_PRIVATE_KEY_BASE64 }}
        run: |
          # 解码私钥到 scripts/private.key
          mkdir -p scripts
          echo "$MP_PRIVATE_KEY_BASE64" | base64 -d > scripts/private.key
          # 生成预览二维码
          node scripts/ci.mjs preview
        # 二维码图片作为 artifact 上传

      - name: Upload preview QR
        uses: actions/upload-artifact@v4
        with:
          name: preview-qr-${{ github.sha }}
          path: preview.png
          retention-days: 7
          if-no-files-found: warn

  upload-experience:
    name: Upload experience version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 注意：仅 main 分支手动触发，避免自动上传污染版本管理
    environment:
      name: mp-zhiming-production
      url: https://mp.weixin.qq.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm + Node
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:weapp

      - name: Upload to experience (miniprogram-ci)
        env:
          MP_PRIVATE_KEY_BASE64: ${{ secrets.MP_PRIVATE_KEY_BASE64 }}
          MP_VERSION: ${{ github.sha }}
          MP_DESC: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p scripts
          echo "$MP_PRIVATE_KEY_BASE64" | base64 -d > scripts/private.key
          node scripts/ci.mjs upload

      - name: Cleanup private key
        if: always()
        run: rm -f scripts/private.key